name: Sync macOS ARM64 JBR

on:
  push:
    paths:
      - .github/workflows/sync-macos-jbr.yml

permissions:
  contents: write

jobs:
  upload-macos-java21:
    runs-on: macos-14
    steps:
      - name: Install Java 21 ARM64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11'
          architecture: aarch64

      - name: Package portable Java runtime
        run: |
          java -version
          rm -rf jre-macos-arm64.zip
          (cd "$JAVA_HOME" && zip -qr "$GITHUB_WORKSPACE/jre-macos-arm64.zip" .)
          shasum -a 256 jre-macos-arm64.zip
          unzip -l jre-macos-arm64.zip | head -20

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 jre-macos-arm64.zip --repo "${{ github.repository }}" --clobber
