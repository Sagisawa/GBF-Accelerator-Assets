name: Sync macOS Platform Tools

on:
  push:
    paths:
      - .github/workflows/sync-macos-platform-tools.yml

permissions:
  contents: write

jobs:
  upload-macos-platform-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download official macOS Platform-Tools
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o platform-tools-darwin.zip \
            https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          sha256sum platform-tools-darwin.zip

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 platform-tools-darwin.zip --repo "${{ github.repository }}" --clobber
